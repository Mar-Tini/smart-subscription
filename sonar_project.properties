sonar.projectKey=Mar-Tini_smart-subscription2
sonar.organization=mar-tini

# Sources et exclusions
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,.github/**,*.config.js

# Couverture
sonar.javascript.lcov.reportPaths=coverage/lcov.info
 
sonar.exclusions=\
  node_modules/**, \
  coverage/**, \
  .github/**, \
  **/*.test.js, \
  **/*.spec.js, \
  **/*.config.js, \
  **/*.min.js, \
  jest.config.js, \
  babel.config.js, \
  webpack.config.js, \
  .eslintrc.js, \
  **/__mocks__/**, \
  **/fixtures/**, \
  **/dist/**, \
  **/build/**
  
# Langage
sonar.language=js

# Encodage
sonar.sourceEncoding=UTF-8
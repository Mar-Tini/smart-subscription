
services:

  # API Node.js (SmartSubscription)
  app:
    image: node:20
    container_name: smart-subscription-app
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
    volumes:
      - .:/app
      - node_modules_volume:/app/node_modules
    networks:
      - smart-network
    command: sh -c "npm cache clean --force && npm install && node index.js"

   


volumes:
  node_modules_volume:

networks:
  smart-network:
    driver: bridge

services:

  # API Node.js (SmartSubscription)
  app:
    image: node:20
    container_name: smart-subscription-app
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
    volumes:
      - .:/app
      - node_modules_volume:/app/node_modules
    depends_on:
      - sonar-db
      - sonarqube
    networks:
      - smart-network
    command: sh -c "npm cache clean --force && npm install && node index.js"

  # SonarQube (Analyse qualité locale)
  sonarqube:
    image: sonarqube:community
    container_name: smart-subscription-sonar
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    depends_on:
      - sonar-db
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-logs:/opt/sonarqube/logs
      - sonar-extensions:/opt/sonarqube/extensions
    networks:
      - smart-network

  # Base PostgreSQL pour SonarQube
  sonar-db:
    image: postgres:15-alpine
    container_name: smart-subscription-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks:
      - smart-network

volumes:
  node_modules_volume:
  sonar-data:
  sonar-logs:
  sonar-extensions:
  sonar-db-data:

networks:
  smart-network:
    driver: bridge